<html>
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #stage {
        height: 1000px;
        width: 1000px;
        margin: 0;
        background: rgb(11, 11, 11);
      }
      #stage {
        position: relative;
        overflow: hidden;
      }

      /* Bottom: Matrix canvas */
      #matrix {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      /* Middle: gradient wash using 'color' blend */
      .color-wash {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none; /* let clicks reach globe */
        mix-blend-mode: color; /* key line */
        /* radial gradient center -> edges, tweak colors/alpha */
        background: radial-gradient(
          circle at 50% 50%,
          rgba(0, 183, 255, 0.9) 0%,
          rgba(0, 0, 0, 0) 50%,
          rgba(0, 0, 0, 0) 100%
        );
        opacity: 1; /* overall strength */
      }

      /* Top: Three.js globe canvas gets rendered here */
      #globeWrap {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="matrix" width="1000" height="1000"></canvas>
      <div class="color-wash"></div>
      <div id="globeWrap"></div>
    </div>

    <script type="module">
      // --- SVG setup (inline → data URL → Image) ---
      const rawSvg = `
<svg width="625" height="660" viewBox="0 0 625 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paint0_linear_134_42155" x1="312.715" y1="-138.205" x2="706.596" y2="50.091" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2998C8"/>
      <stop offset="1" stop-color="#13244C"/>
    </linearGradient>
  </defs>
  <path d="M611.209 102.718C566.558 103.637 521.844 104.368 478.259 104.89H475.164L503.419 0H428.4L400.02 105.412H378.751C373.794 105.412 367.102 105.412 358.527 105.308L355.432 105.203L383.812 0H308.794L280.686 104.284L179.901 102.634L165.22 109.84L157.544 140.856C149.409 171.057 138.91 203.911 126.529 238.54L121.719 251.928H187.953L204.935 212.265C216.647 186.701 221.374 181.249 222.168 180.435C223.821 179.098 227.501 176.822 236.139 175.589C239.485 175.067 246.136 174.461 258.642 173.939L261.947 173.835L220.579 327.264L178.166 364.775C116.344 419.079 61.9261 465.237 16.271 502.018L13.3012 504.482L0 554.149L160.64 550.035L130.984 659.979H206.002L235.512 550.661H237.687C249.336 550.87 262.302 551.184 276.733 551.392L279.828 551.497L250.59 660H325.609L354.428 552.833L415.225 553.857H493.129L505.761 542.223L506.702 539.237C522.743 484.62 539.161 437.333 555.453 398.799L561.35 384.784H492.627L479.347 416.886C459.541 463.775 448.75 471.712 445.864 473.049C442.977 474.281 430.576 477.372 377.642 478.709L374.443 478.813L417.4 319.097L418.069 318.471C477.736 265.504 541.858 209.55 608.741 152.259L611.502 149.899L624.322 102.404L611.209 102.718ZM299.278 479.44H241.096L256.844 464.799C275.018 447.902 293.527 430.901 312.14 413.795L318.456 408.03L299.278 479.44ZM380.905 183.087C363.191 199.378 344.703 216.171 325.776 233.381L319.481 239.041L337.195 172.999H391.885L380.905 183.087Z" fill="white"/>
</svg>
`.trim();

      const canvas = document.getElementById("matrix");
      const ctx = canvas.getContext("2d", { alpha: true });

      // --- DPI scaling for crispness ---
      // const DPR = Math.max(1, Math.floor(window.devicePixelRatio || 1));
      // function resize() {
      //   const w = (canvas.clientWidth = document.body.offsetWidth);
      //   const h = (canvas.clientHeight = document.body.offsetHeight);
      //   canvas.width = w * DPR;
      //   canvas.height = h * DPR;
      //   ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      // }
      // resize();
      // addEventListener("resize", resize);

      // --- Colors & font ---
      const DIGIT_COLOR = "rgba(240,240,240,0.5)"; // soft grayish white
      const SVG_COLOR = "rgba(255,255,255,1)"; // bright white
      const FADE_COLOR = "11,11,11";
      const FADE_ALPHA = "0.1";
      const FADE_RGBA = `rgba(${FADE_COLOR},${FADE_ALPHA})`;
      ctx.font = "300 15pt 'Poppins', sans-serif";

      // Grid
      const CELL = 20;
      const COLS = Math.floor(canvas.width / CELL);
      const ROWS = Math.floor(canvas.height / CELL);

      // Per-cell intensity [0..1], fades every tick
      const intensity = new Float32Array(COLS * ROWS);

      // Stream heads per column (you already have ypos)
      const ypos = Array(COLS).fill(0);

      // Tuning
      const DECAY = 0.9; // per-frame decay (0.90–0.97 looks nice)
      const THRESH = 0.02; // don't draw if dimmer than this
      const SVG_PROBABILITY = 0.01;

      // Helper
      const idx = (c, r) => r * COLS + c;

      // Note: we force the path fill to white (above) so it pops against gray digits.
      // If you want to keep the gradient, leave your original fills and just draw the image at full alpha.

      function svgToImage(svgString) {
        const blob = new Blob([svgString], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
          };
          img.src = url;
        });
      }

      const SVG_SCALE = 0.04; // roughly scale the 625x660 art down to cell size (tweak to taste)
      let svgImg = null;
      svgToImage(rawSvg).then((img) => (svgImg = img));

      // --- Matrix loop ---
      const SPEED = 50; // ms/frame

      ctx.fillStyle = `rgb(${FADE_COLOR})`;

      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      function tick() {
        // 1) update stream heads -> set intensity for the head cell to 1
        for (let c = 0; c < COLS; c++) {
          const y = ypos[c];
          const row = Math.floor(y / CELL);
          if (row >= 0 && row < ROWS) intensity[idx(c, row)] = 1; // mark the head bright

          // advance stream
          if (y > canvas.height && Math.random() > 0.975) ypos[c] = 0;
          else ypos[c] = y + CELL;
        }

        // 2) decay all cells toward 0
        for (let i = 0; i < intensity.length; i++) {
          intensity[i] *= DECAY;
        }

        // 3) clear to your exact background (off-black), then draw cells by intensity
        //    (No translucent overlay; we rebuild the frame deterministically.)
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = `rgb(${FADE_COLOR})`; // your off-black target
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.imageSmoothingEnabled = true;

        for (let r = 0; r < ROWS; r++) {
          const y = r * CELL;
          for (let c = 0; c < COLS; c++) {
            const a = intensity[idx(c, r)];
            if (a < THRESH) continue; // skip very dim cells

            const xCenter = c * CELL + CELL / 2;

            // occasional SVG instead of text
            if (svgImg && Math.random() < SVG_PROBABILITY) {
              const w = CELL,
                h = (svgImg.height / svgImg.width) * w;
              const x = xCenter - w / 2;
              ctx.globalAlpha = a; // use intensity as alpha
              ctx.drawImage(svgImg, x, y, w, h);
            } else {
              // draw digit with intensity-based alpha
              ctx.globalAlpha = a;
              ctx.fillStyle = "#e9e9e9"; // opaque light gray for glyph color
              const ch = ((Math.random() * 10) | 0).toString(); // 0–9
              ctx.fillText(ch, xCenter, y);
            }
          }
        }

        ctx.globalAlpha = 1; // reset
      }

      const loop = setInterval(tick, SPEED);
    </script>
  </body>
</html>
